# Local run of the production image next to a throwaway MongoDB.
# App (API + frontend) on http://localhost:3000. Data persists in the mongo-data volume.
services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env # JWT_SECRET and optional geocoder settings
    environment:
      # Inside the compose network the database is reached by service name;
      # this overrides whatever MONGO_URI the local .env has.
      MONGO_URI: mongodb://admin:secret@mongodb:27017/mydb?authSource=admin
      PORT: "3000"
    depends_on:
      - mongodb

volumes:
  mongo-data:
